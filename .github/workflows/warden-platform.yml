# Managed by Warden. Editing this file is a protected change and will be flagged.
# Informational only: builds the app on GitHub's runners. The required checks
# (warden/*) come from Warden and cannot be produced or altered from here.
name: fallback-build
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: fallback-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec next build
