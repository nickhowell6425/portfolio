<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paradox — Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --void: oklch(0.06 0.014 158);
    --panel: oklch(0.092 0.016 158);
    --emerald: oklch(0.78 0.15 158);
    --jade: oklch(0.7 0.1 165);
    --gold: oklch(0.86 0.12 86);
    --soft: oklch(0.95 0.008 158);
    --dim: oklch(0.66 0.03 160);
    --faint: oklch(0.5 0.02 160);
    --line: oklch(0.78 0.12 158 / 0.16);
    --line-soft: oklch(0.78 0.12 158 / 0.08);
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Space Grotesk", system-ui, sans-serif;
    --topbar: 72px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--sans); color: var(--soft); background: var(--void); -webkit-font-smoothing: antialiased; overflow: hidden; }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
  ::selection { background: oklch(0.78 0.15 158 / 0.3); }

  button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }

  /* scrollbars */
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: oklch(0.78 0.12 158 / 0.14); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.12 158 / 0.26); background-clip: content-box; }

  /* ---------------- top bar ---------------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--topbar); z-index: 30;
    display: flex; align-items: center; gap: 26px; padding: 0 26px;
    background: oklch(0.06 0.014 158 / 0.82); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand .glyph { width: 26px; height: 26px; position: relative; }
  .brand .glyph::before, .brand .glyph::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .brand .glyph::before { border: 1.4px solid var(--emerald); opacity: 0.5; }
  .brand .glyph::after { inset: 6px; background: radial-gradient(circle, var(--emerald), transparent 70%); box-shadow: 0 0 14px var(--emerald); }
  .brand .word { font-family: var(--serif); font-size: 23px; letter-spacing: 0.42em; font-weight: 500; padding-left: 0.42em; }
  .brand:hover .glyph::before { opacity: 0.8; }
  .nav-spacer { flex: 1; }
  .navlinks { display: flex; align-items: center; gap: 2px; }
  .navbtn { position: relative; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); background: none; border: none; padding: 10px 16px; border-radius: 2px; transition: color 0.3s ease; white-space: nowrap; }
  .navbtn:hover { color: var(--soft); }
  .navbtn.active { color: var(--soft); }
  .navbtn::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 2px; height: 1px; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); opacity: 0; transform: scaleX(0.4); transform-origin: center; transition: opacity 0.45s ease, transform 0.55s cubic-bezier(0.22,1,0.36,1); pointer-events: none; }
  .navbtn.active::after { opacity: 1; transform: scaleX(1); }
  .navbtn.ghost { border: 1px solid var(--line); color: var(--soft); margin-left: 8px; }
  .navbtn.ghost:hover { border-color: var(--emerald); }

  /* ---------------- three-column layout ---------------- */
  .app {
    position: fixed; inset: var(--topbar) 0 0 0; z-index: 10;
    display: grid; grid-template-columns: 252px minmax(0, 1fr);
    transition: grid-template-columns 0.4s cubic-bezier(0.22,1,0.36,1);
  }
  .app.show-preview { grid-template-columns: 252px minmax(0, 1fr) 372px; }
  .col { height: 100%; overflow-y: auto; }
  .left { border-right: 1px solid var(--line-soft); padding: 28px 22px 60px; }
  .center { padding: 30px 40px 80px; }
  .right { border-left: 1px solid var(--line-soft); padding: 0; display: none; }
  .app.show-preview .right { display: block; }

  /* ---------------- left sidebar ---------------- */
  .fgroup { margin-bottom: 30px; }
  .fgroup > h3 { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--faint); margin-bottom: 13px; }
  .fitem { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: none; border: none; color: var(--dim); padding: 9px 11px; border-radius: 3px; font-size: 13.5px; letter-spacing: 0.02em; transition: color 0.18s, background 0.18s; position: relative; white-space: nowrap; }
  .fitem:hover { color: var(--soft); background: oklch(0.78 0.14 158 / 0.05); }
  .fitem.on { color: var(--soft); background: oklch(0.78 0.14 158 / 0.1); }
  .fitem.on::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 2px; height: 16px; background: var(--emerald); border-radius: 2px; box-shadow: 0 0 8px var(--emerald); }
  .fitem .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: currentColor; opacity: 0.5; }
  .fitem.on .dot { opacity: 1; background: var(--emerald); box-shadow: 0 0 7px var(--emerald); }
  .fitem .ico { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; opacity: 0.8; }
  .fitem .count { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .fitem .stat-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .fitem .stat-dot.active { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
  .fitem .stat-dot.emerging { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .fitem .stat-dot.completed { background: var(--faint); }
  .fitem .stat-dot.official { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  .left .reset { margin-top: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); background: none; border: 1px solid var(--line-soft); border-radius: 3px; padding: 9px; width: 100%; transition: 0.2s; }
  .left .reset:hover { color: var(--soft); border-color: var(--line); }

  /* ---------------- nav search (compact, matches home) ---------------- */
  .search { position: relative; width: min(420px, 32vw); display: flex; align-items: center; gap: 10px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 2px; background: oklch(0.14 0.02 158 / 0.4); backdrop-filter: blur(8px); transition: border-color 0.3s, background 0.3s; }
  .search:focus-within { border-color: oklch(0.78 0.14 158 / 0.55); background: oklch(0.16 0.03 158 / 0.55); }
  .search svg { width: 15px; height: 15px; stroke: var(--dim); fill: none; stroke-width: 2; flex: none; }
  .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--soft); font-family: var(--sans); font-size: 13px; letter-spacing: 0.04em; }
  .search input::placeholder { color: var(--dim); letter-spacing: 0.06em; }
  .search .kbd { font-size: 10px; letter-spacing: 0.08em; color: var(--faint); border: 1px solid var(--line-soft); border-radius: 3px; padding: 3px 7px; flex: none; }
  .search-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 25; background: oklch(0.1 0.018 158 / 0.98); backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; max-height: 56vh; overflow-y: auto; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: 0.18s; }
  .search-results.show { opacity: 1; transform: none; pointer-events: auto; }
  .sr-item { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--line-soft); }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover, .sr-item.sel { background: oklch(0.78 0.14 158 / 0.08); }
  .sr-item .sr-type { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--jade); width: 64px; flex: none; }
  .sr-item .sr-t { font-family: var(--serif); font-size: 16.5px; flex: 1; }
  .sr-item .sr-m { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .sr-empty { padding: 20px; text-align: center; color: var(--faint); font-size: 13px; }

  /* ---------------- center: section headers ---------------- */
  .sec { margin-bottom: 40px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
  .sec-head h2 { font-family: var(--serif); font-weight: 500; font-size: 23px; letter-spacing: 0.01em; }
  .sec-head .sub { font-size: 11px; letter-spacing: 0.04em; color: var(--faint); }
  .sec-head .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 8px var(--emerald); animation: blink 2.4s infinite; align-self: center; }
  .sec-head .seeall { margin-left: auto; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); background: none; border: none; }
  .sec-head .seeall:hover { color: var(--emerald); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ---------------- featured ---------------- */
  .featured { display: grid; grid-template-columns: 248px 1fr; gap: 28px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: linear-gradient(150deg, oklch(0.11 0.02 158 / 0.7), oklch(0.08 0.015 158 / 0.5)); padding: 26px; margin-bottom: 42px; position: relative; }
  .featured::before { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none; box-shadow: inset 0 0 60px oklch(0.86 0.12 86 / 0.05); }
  .cover { border-radius: 4px; position: relative; overflow: hidden; aspect-ratio: 3/4; }
  .cover .art { position: absolute; inset: 0; }
  .cover .art::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(circle at 32% 28%, oklch(0.66 0.16 var(--h1) / 0.6), transparent 58%),
      radial-gradient(circle at 74% 76%, oklch(0.58 0.14 var(--h2) / 0.5), transparent 56%),
      oklch(0.1 0.018 158); }
  .cover .art::after { content: ""; position: absolute; inset: 0; opacity: 0.5; background:
      repeating-linear-gradient(118deg, transparent 0 22px, oklch(0.85 0.08 158 / 0.06) 22px 23px); mix-blend-mode: screen; }
  .cover .seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; }
  .cover .seal::before, .cover .seal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid oklch(0.92 0.04 158 / 0.5); }
  .cover .seal::after { inset: 16px; background: radial-gradient(circle, oklch(0.95 0.04 158 / 0.9), transparent 70%); border: none; box-shadow: 0 0 18px oklch(0.85 0.1 158 / 0.6); }
  .cover .badge { position: absolute; top: 12px; left: 12px; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--void); background: var(--gold); padding: 5px 10px; border-radius: 100px; font-weight: 600; }

  .fbody { display: flex; flex-direction: column; }
  .fbody .fk { font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 9px; }
  .fbody .fk .cat { color: var(--dim); }
  .fbody .ftitle { font-family: var(--serif); font-weight: 500; font-size: 44px; line-height: 1.02; margin-bottom: 12px; }
  .fbody .flog { font-family: var(--serif); font-style: italic; font-size: 18px; line-height: 1.5; color: var(--jade); margin-bottom: 22px; max-width: 52ch; }
  .fstats { display: flex; gap: 36px; margin-bottom: 26px; }
  .fstats .s .v { font-family: var(--serif); font-size: 27px; line-height: 1; }
  .fstats .s .k { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }
  .frow { display: flex; gap: 12px; margin-top: auto; }
  .btn { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; padding: 14px 26px; border-radius: 3px; border: 1px solid var(--line); background: none; color: var(--soft); transition: 0.22s; }
  .btn:hover { border-color: var(--emerald); color: var(--emerald); }
  .btn.gold { background: var(--gold); color: var(--void); border-color: var(--gold); font-weight: 600; box-shadow: 0 0 30px oklch(0.86 0.12 86 / 0.25); }
  .btn.gold:hover { background: oklch(0.9 0.12 86); color: var(--void); }

  /* ---------------- list rows ---------------- */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; align-items: center; gap: 18px; padding: 15px 14px; border-radius: 4px; border: 1px solid transparent; transition: background 0.18s, border-color 0.18s; cursor: pointer; position: relative; text-align: left; background: none; width: 100%; }
  .row + .row { border-top: 1px solid var(--line-soft); }
  .row:hover { background: oklch(0.78 0.14 158 / 0.05); border-color: var(--line); border-top-color: var(--line); }
  .row:hover + .row { border-top-color: transparent; }
  .row.sel { background: oklch(0.78 0.14 158 / 0.08); border-color: oklch(0.78 0.14 158 / 0.3); }

  /* timeline row layout */
  .row.tl { grid-template-columns: 40px minmax(0, 2.3fr) minmax(0, 1fr) auto; }
  .row .rank { font-family: var(--serif); font-size: 19px; color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }
  .row .thumb { width: 40px; height: 52px; border-radius: 3px; overflow: hidden; position: relative; }
  .row .thumb .art { position: absolute; inset: 0; background:
      radial-gradient(circle at 35% 30%, oklch(0.64 0.16 var(--h1) / 0.7), transparent 60%),
      radial-gradient(circle at 70% 75%, oklch(0.56 0.14 var(--h2) / 0.55), transparent 58%),
      oklch(0.11 0.018 158); }
  .rmain { min-width: 0; }
  .rtitle { font-family: var(--serif); font-size: 19px; line-height: 1.16; color: var(--soft); transition: color 0.18s; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row:hover .rtitle { color: var(--emerald); }
  .row.hot:hover .rtitle { color: var(--gold); }
  .rsub { font-size: 11.5px; color: var(--faint); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rsub > span { white-space: nowrap; }
  .rsub .cat { color: var(--jade); }
  .rsub .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
  .rsub .own { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 7px; border-radius: 100px; line-height: 1.4; white-space: nowrap; }
  .rsub .own.official { color: var(--gold); border: 1px solid oklch(0.86 0.12 86 / 0.4); background: oklch(0.86 0.12 86 / 0.08); }
  .rsub .own.original { color: var(--jade); border: 1px solid var(--line-soft); }
  .rmeta { display: flex; gap: 26px; }
  .rmeta .m .v { font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .rmeta .m .k { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-top: 3px; }
  .ractivity { font-size: 11.5px; color: var(--dim); white-space: nowrap; text-align: right; min-width: 92px; }
  .ractivity .live { color: var(--emerald); }
  .ractivity .lbl { display: block; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-top: 3px; }

  /* branch / variant rows */
  .row.br { grid-template-columns: 28px 1fr auto auto; }
  .row.va { grid-template-columns: 28px 1fr auto; }
  .row.ch { grid-template-columns: 34px minmax(0,1fr) auto auto; }
  .row .charav { width: 26px; height: 26px; border-radius: 50%; justify-self: center; background: radial-gradient(circle at 34% 30%, oklch(0.74 0.13 var(--ah,158) / 0.95), oklch(0.4 0.09 var(--ah,158))); box-shadow: 0 0 0 1px var(--line-soft); position: relative; }
  .row .charav::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px oklch(0.9 0.04 158 / 0.25); }
  .row .vcount { font-size: 13px; color: var(--jade); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .vcount .k { color: var(--faint); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 5px; }
  .row .glyphdot { width: 9px; height: 9px; border-radius: 50%; justify-self: center; }
  .row .glyphdot.em { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .row .glyphdot.va { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
  .row .origin { font-size: 11.5px; color: var(--faint); }
  .row .origin b { color: var(--jade); font-weight: 400; }
  .row .growth { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .growth svg { width: 12px; height: 12px; stroke: var(--gold); fill: none; stroke-width: 2.2; }
  .row .vtag { font-size: 11px; letter-spacing: 0.08em; color: var(--dim); font-variant-numeric: tabular-nums; }

  .empty-state { text-align: center; color: var(--faint); padding: 70px 20px; font-family: var(--serif); font-style: italic; font-size: 18px; }

  /* result count strip when filtering */
  .resultbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-size: 12px; color: var(--dim); letter-spacing: 0.03em; }
  .resultbar b { color: var(--soft); font-weight: 500; }
  .resultbar .chips { display: flex; gap: 8px; margin-left: auto; }
  .resultbar .chip { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 0.04em; color: var(--jade); border: 1px solid var(--line); border-radius: 100px; padding: 5px 12px; }
  .resultbar .chip button { background: none; border: none; color: var(--faint); font-size: 13px; line-height: 1; }
  .resultbar .chip button:hover { color: var(--soft); }

  /* ---------------- right preview panel ---------------- */
  .right .preview { padding: 30px 28px 50px; }
  .preview-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 100%; padding: 40px 36px; color: var(--faint); }
  .preview-empty .ring { width: 54px; height: 54px; position: relative; margin-bottom: 22px; opacity: 0.7; }
  .preview-empty .ring::before, .preview-empty .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--line); }
  .preview-empty .ring::after { inset: 16px; background: radial-gradient(circle, oklch(0.7 0.1 158 / 0.4), transparent 70%); border: none; }
  .preview-empty h4 { font-family: var(--serif); font-size: 20px; color: var(--dim); margin-bottom: 8px; }
  .preview-empty p { font-size: 12.5px; line-height: 1.6; max-width: 26ch; }

  .pv-cover { aspect-ratio: 16/10; border-radius: 5px; overflow: hidden; position: relative; margin-bottom: 22px; }
  .pv-cover .art { position: absolute; inset: 0; background:
      radial-gradient(circle at 30% 28%, oklch(0.64 0.16 var(--h1) / 0.65), transparent 60%),
      radial-gradient(circle at 76% 74%, oklch(0.56 0.14 var(--h2) / 0.5), transparent 58%),
      oklch(0.1 0.018 158); }
  .pv-cover .art::after { content: ""; position: absolute; inset: 0; opacity: 0.45; background: repeating-linear-gradient(118deg, transparent 0 20px, oklch(0.85 0.08 158 / 0.06) 20px 21px); }
  .pv-cover .seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 46px; height: 46px; }
  .pv-cover .seal::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid oklch(0.92 0.04 158 / 0.5); }
  .pv-cover .seal::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: radial-gradient(circle, oklch(0.95 0.04 158 / 0.9), transparent 70%); box-shadow: 0 0 16px oklch(0.85 0.1 158 / 0.6); }
  .pv-cover .pv-badge { position: absolute; top: 12px; left: 12px; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; padding: 5px 11px; border-radius: 100px; font-weight: 600; }
  .pv-badge.tl { color: var(--void); background: var(--emerald); }
  .pv-badge.gold { color: var(--void); background: var(--gold); }
  .pv-badge.br { color: var(--gold); background: oklch(0.86 0.12 86 / 0.14); border: 1px solid oklch(0.86 0.12 86 / 0.4); }
  .pv-badge.va { color: var(--emerald); background: oklch(0.78 0.15 158 / 0.12); border: 1px solid oklch(0.78 0.15 158 / 0.4); }

  .pv-type { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--emerald); }
  .pv-type.gold { color: var(--gold); }
  .pv-title { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.06; margin: 9px 0 6px; }
  .pv-sub { font-size: 11.5px; color: var(--faint); letter-spacing: 0.04em; margin-bottom: 16px; }
  .pv-sub b { color: var(--jade); font-weight: 400; }
  .pv-desc { font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.55; color: var(--soft); margin-bottom: 22px; }

  .pv-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
  .pv-stats .cell { background: oklch(0.085 0.016 158); padding: 14px 12px; }
  .pv-stats .v { font-family: var(--serif); font-size: 22px; line-height: 1; }
  .pv-stats .k { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }

  .pv-sec { margin-bottom: 22px; }

          <svg class="ico" viewBox="0 0 24 24"><path d="M3 12h18M6 8v8M12 6v12M18 9v6"/></svg>Timelines<span class="count" id="cntTimeline"></span></button>

          <svg class="ico" viewBox="0 0 24 24"><path d="M6 3v6a4 4 0 0 0 4 4h8M6 21v-6"/><circle cx="6" cy="3" r="1.6"/><circle cx="18" cy="13" r="1.6"/></svg>Branches<span class="count" id="cntBranch"></span></button>
        <button class="fitem" data-filter="browse" data-value="variant">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Variants<span class="count" id="cntVariant"></span></button>
        <button class="fitem" data-filter="browse" data-value="character">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"/></svg>Characters<span class="count" id="cntCharacter"></span></button>
        <button class="fitem" data-filter="browse" data-value="event">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Events<span class="count" id="cntEvent"></span></button>
      </div>

      <div class="fgroup">
        <h3>Ownership</h3>
        <button class="fitem on" data-filter="ownership" data-value=""><span class="dot"></span>All Sources</button>
        <button class="fitem" data-filter="ownership" data-value="official"><span class="stat-dot official"></span>Official IP<span class="count" id="cntOfficial"></span></button>
        <button class="fitem" data-filter="ownership" data-value="original"><span class="stat-dot active"></span>Original IP<span class="count" id="cntOriginal"></span></button>
      </div>

      <div class="fgroup">
        <h3>Categories</h3>
        <button class="fitem on" data-filter="category" data-value=""><span class="dot"></span>All Genres</button>
        <button class="fitem" data-filter="category" data-value="Science Fiction"><span class="dot"></span>Science Fiction</button>
        <button class="fitem" data-filter="category" data-value="Fantasy"><span class="dot"></span>Fantasy</button>
        <button class="fitem" data-filter="category" data-value="Horror"><span class="dot"></span>Horror</button>
        <button class="fitem" data-filter="category" data-value="Mystery"><span class="dot"></span>Mystery</button>
        <button class="fitem" data-filter="category" data-value="Original Worlds"><span class="dot"></span>Original Worlds</button>
      </div>

      <div class="fgroup">
        <h3>Sort By</h3>
        <button class="fitem on" data-filter="sort" data-value="Trending"><span class="dot"></span>Trending</button>
        <button class="fitem" data-filter="sort" data-value="Most Read"><span class="dot"></span>Most Read</button>
        <button class="fitem" data-filter="sort" data-value="Most Branched"><span class="dot"></span>Most Branched</button>
        <button class="fitem" data-filter="sort" data-value="Newest"><span class="dot"></span>Newest</button>
        <button class="fitem" data-filter="sort" data-value="Recently Active"><span class="dot"></span>Recently Active</button>
      </div>

      <div class="fgroup">
        <h3>Status</h3>
        <button class="fitem on" data-filter="status" data-value=""><span class="dot"></span>Any Status</button>
        <button class="fitem" data-filter="status" data-value="Active"><span class="stat-dot active"></span>Active</button>
        <button class="fitem" data-filter="status" data-value="Emerging"><span class="stat-dot emerging"></span>Emerging</button>
        <button class="fitem" data-filter="status" data-value="Completed"><span class="stat-dot completed"></span>Completed</button>
      </div>

      <button class="reset" id="resetFilters">Reset Filters</button>
      </div>
      <div id="docNav" class="docnav"></div>
    </aside>

    <!-- CENTER: discovery -->
    <main class="col center scroll" id="center">
      <div id="feed"></div>
    </main>
